{% extends 'base.html' %}
{% block title %}Reportar novedad{% endblock %}
{% block content %}
<div class="page-heading">
  <div><span class="eyebrow">Operación y SST / HSE</span><h1 class="h2 mb-0">Reportar novedad</h1><p class="text-muted mb-0">Registra novedades operativas, del vehículo, viales, documentales o de seguridad.</p></div>
  <a class="btn btn-outline-secondary" href="{{ url_for('sst.dashboard') }}">Volver</a>
</div>
<div class="row justify-content-center"><div class="col-12 col-lg-8"><div class="card border-0 shadow-sm"><div class="card-body p-3 p-md-4">
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
      <div class="col-12 col-md-6"><label class="form-label">Fecha y hora *</label><input class="form-control" type="datetime-local" name="occurred_at" required></div>
      <div class="col-12 col-md-6"><label class="form-label">Proyecto</label><div class="record-lookup" data-lookup-url="{{ url_for('api.lookup', resource='projects') }}" data-context-url="{{ url_for('api.record_context', resource='project', record_id=0) }}" data-context-target="#project-context"><input class="form-control" data-lookup-input placeholder="Buscar código, cliente o ubicación" autocomplete="off"><input type="hidden" name="project_id"><div class="lookup-results" hidden></div></div><div id="project-context" hidden></div></div>
      <div class="col-12 col-md-6"><label class="form-label">Tipo de novedad *</label><select class="form-select" name="report_type" required>{% for key, label in report_types.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></div>
      <div class="col-12 col-md-3"><label class="form-label">Clasificación SST</label><select class="form-select" name="incident_type"><option value="unsafe_condition">No aplica / condición</option><option value="near_miss">Casi accidente</option><option value="accident">Accidente</option><option value="illness">Enfermedad</option></select></div>
      <div class="col-12 col-md-3"><label class="form-label">Prioridad *</label><select class="form-select" name="severity"><option value="low">Baja</option><option value="medium" selected>Media</option><option value="high">Alta</option><option value="critical">Crítica</option></select></div>
      <div class="col-12"><label class="form-label">Persona involucrada</label><input class="form-control form-control-sm mb-2" data-select-filter="#incident-employee" placeholder="Filtrar persona"><select class="form-select" id="incident-employee" name="employee_id"><option value="">No especificada</option>{% for employee in employees %}<option value="{{ employee.id }}">{{ employee.name }}</option>{% endfor %}</select></div>
      <div class="col-12"><label class="form-label">Descripción *</label><textarea class="form-control" name="description" rows="5" required placeholder="Describe qué ocurrió, qué se necesita y si requiere atención inmediata."></textarea></div>
    </div>
    <button class="btn btn-primary mt-4" type="submit">Registrar novedad</button>
  </form>
</div></div></div></div>
{% endblock %}
