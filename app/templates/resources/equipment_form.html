{% extends 'base.html' %}
{% block title %}Nuevo equipo{% endblock %}
{% block content %}
<div class="page-heading"><div><span class="eyebrow">Control de recursos</span><h1 class="h2 mb-0">Registrar vehículo o equipo</h1></div><a class="btn btn-outline-secondary" href="{{ url_for('resources.equipment_list') }}">Volver</a></div>
<div class="card border-0 shadow-sm"><div class="card-body"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-4"><label class="form-label">Código / placa *</label><input class="form-control" name="asset_code" required></div><div class="col-md-8"><label class="form-label">Nombre *</label><input class="form-control" name="name" placeholder="Camioneta, camión, vehículo de placas..." required></div><div class="col-md-4"><label class="form-label">Tipo</label><input class="form-control" name="equipment_type"></div><div class="col-md-4"><label class="form-label">Marca</label><input class="form-control" name="brand"></div><div class="col-md-4"><label class="form-label">Modelo</label><input class="form-control" name="model"></div><div class="col-md-6"><label class="form-label">Conductor asignado</label><select class="form-select" name="assigned_driver_employee_id"><option value="">Sin asignar</option>{% for driver in drivers %}<option value="{{ driver.id }}">{{ driver.name }} · {{ driver.identification_number }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Proyecto</label><select class="form-select" name="project_id"><option value="">Sin asignar</option>{% for project in projects %}<option value="{{ project.id }}">{{ project.code }} · {{ project.name }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Restricciones e instrucciones para el conductor</label><textarea class="form-control" name="vehicle_restrictions" rows="3" placeholder="Carga máxima, rutas autorizadas, elementos obligatorios, restricciones de uso..."></textarea></div><div class="col-md-4"><label class="form-label">Estado</label><select class="form-select" name="status"><option value="available">Disponible</option><option value="assigned">Asignado</option><option value="maintenance">Mantenimiento</option><option value="out_of_service">Fuera de servicio</option></select></div><div class="col-md-4"><label class="form-label">Ubicación</label><input class="form-control" name="location"></div><div class="col-md-4"><label class="form-label">Próximo servicio</label><input class="form-control" type="date" name="next_service_date"></div><div class="col-12"><label class="form-label">Notas internas</label><textarea class="form-control" name="notes" rows="2"></textarea></div></div><button class="btn btn-primary mt-4">Guardar vehículo</button></form></div></div>
{% endblock %}
